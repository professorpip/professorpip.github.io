<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Selective migration from a VM to a Mac mini</title><desc id="d">Two prior VM-based assistants feed a curated migration into a new always-on Mac mini identity, leaving live credentials and scheduler state behind.</desc><rect width="960" height="480" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle">
<text x="480" y="48" font-size="25" font-weight="700" fill="#17233d">Selective migration, not a raw copy</text>
<rect x="60" y="86" width="230" height="80" rx="16" fill="#8a3b53"/><text x="175" y="120" font-size="18" font-weight="700" fill="white">Original Tiggy</text><text x="175" y="145" font-size="14" fill="white">Ubuntu VM, messy state</text>
<rect x="340" y="86" width="230" height="80" rx="16" fill="#a86b2e"/><text x="455" y="120" font-size="18" font-weight="700" fill="white">Tiggy2</text><text x="455" y="145" font-size="14" fill="white">Ubuntu VM, backup identity</text>
<path d="M175 166v50h305v40" stroke="#64748b" stroke-width="4" fill="none"/>
<path d="M455 166v90" stroke="#64748b" stroke-width="4" fill="none"/>
<rect x="330" y="256" width="300" height="70" rx="16" fill="#17233d"/><text x="480" y="288" font-size="18" font-weight="700" fill="white">Selective merge</text><text x="480" y="310" font-size="13" fill="white">memories, persona, tool notes — not credentials/cron state</text>
<path d="M480 326v40" stroke="#64748b" stroke-width="4" fill="none"/>
<rect x="330" y="376" width="300" height="80" rx="16" fill="#3f7d5c"/><text x="480" y="410" font-size="19" font-weight="700" fill="white">Mac mini Tiggy</text><text x="480" y="435" font-size="14" fill="white">new primary identity, always-on host</text>
</g></svg>
