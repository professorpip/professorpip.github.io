<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">Remote ZHA coordinator</title><desc id="d">Home Assistant connects over the local network to ser2net on OpenWRT, which connects by USB serial to a Zigbee coordinator.</desc><rect width="960" height="450" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="54" font-size="28" font-weight="700" fill="#17233d">Move the radio, not Home Assistant</text><rect x="55" y="145" width="200" height="115" rx="20" fill="#dce9ff"/><text x="155" y="190" font-size="21" font-weight="700" fill="#17233d">Home Assistant</text><text x="155" y="225" font-size="15" fill="#59677f">ZHA socket client</text><rect x="370" y="125" width="220" height="155" rx="22" fill="#d8f2e5"/><text x="480" y="170" font-size="21" font-weight="700" fill="#17233d">OpenWRT AP</text><rect x="410" y="195" width="140" height="50" rx="13" fill="white"/><text x="480" y="226" font-size="17" fill="#17233d">ser2net</text><rect x="705" y="145" width="200" height="115" rx="20" fill="#ffe8ba"/><text x="805" y="190" font-size="21" font-weight="700" fill="#17233d">USB coordinator</text><text x="805" y="225" font-size="15" fill="#59677f">Zigbee radio</text><path d="M255 202h115" stroke="#64748b" stroke-width="4"/><text x="313" y="187" font-size="14" fill="#59677f">LAN</text><path d="M590 202h115" stroke="#64748b" stroke-width="4"/><text x="648" y="187" font-size="14" fill="#59677f">USB serial</text><text x="480" y="350" font-size="20" font-weight="700" fill="#17233d">One listener · correct driver · 115200 8N1</text><text x="480" y="388" font-size="16" fill="#59677f">Judge recovery by coordinator and device state, not one restart response.</text></g></svg>
