<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">VRAM headroom for the same GGUF model on Windows versus Ubuntu</title><desc id="d">The identical 27B model at 32K context leaves about 530 MiB free on Windows and roughly three times as much free on Ubuntu on the same RTX 5060 Ti 16 GB GPU.</desc><rect width="960" height="430" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="50" font-size="26" font-weight="700" fill="#17233d">Same model, same GPU, different headroom</text><text x="480" y="76" font-size="15" fill="#59677f">RTX 5060 Ti 16 GB · 27B GGUF · 32K context</text><g font-size="15" font-weight="700" fill="#17233d"><text x="230" y="115">Windows</text><text x="730" y="115">Ubuntu</text></g><g><rect x="150" y="135" width="160" height="230" rx="10" fill="#e2e8f0" stroke="#59677f" stroke-width="2"/><rect x="150" y="140" width="160" height="217" rx="6" fill="#c94f4f"/><rect x="150" y="357" width="160" height="8" fill="#3fae6a"/><text x="230" y="392" font-size="13" fill="#59677f">~530 MiB free</text><rect x="650" y="135" width="160" height="230" rx="10" fill="#e2e8f0" stroke="#59677f" stroke-width="2"/><rect x="650" y="140" width="160" height="192" rx="6" fill="#c94f4f"/><rect x="650" y="332" width="160" height="33" fill="#3fae6a"/><text x="730" y="392" font-size="13" fill="#59677f">~1,700+ MiB free</text></g><text x="480" y="415" font-size="16" fill="#59677f">Extra Ubuntu headroom is what let MTP speculative decoding run reliably at this context.</text></g></svg>
