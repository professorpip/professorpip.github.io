<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" role="img" aria-labelledby="t d"><title id="t">System duplex voice pipeline</title><desc id="d">Audio flows through browser echo cancellation, voice detection, local ASR, OpenClaw and local TTS, with an interruption path cancelling playback.</desc><rect width="1040" height="450" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="520" y="53" font-size="28" font-weight="700" fill="#17233d">Specialists around one agent state</text><g font-size="16" font-weight="700" fill="#17233d"><rect x="30" y="150" width="145" height="75" rx="16" fill="#dce9ff"/><text x="103" y="183">Safari</text><text x="103" y="205" font-size="13">capture + AEC</text><rect x="205" y="150" width="125" height="75" rx="16" fill="#d8f2e5"/><text x="268" y="194">VAD + gate</text><rect x="360" y="150" width="125" height="75" rx="16" fill="#ffe8ba"/><text x="423" y="183">Nemotron</text><text x="423" y="205" font-size="13">local ASR</text><rect x="515" y="135" width="165" height="105" rx="18" fill="#17233d"/><text x="598" y="181" fill="white">OpenClaw</text><text x="598" y="205" font-size="13" fill="white">memory + tools</text><rect x="710" y="150" width="125" height="75" rx="16" fill="#f3dcec"/><text x="773" y="183">Kokoro</text><text x="773" y="205" font-size="13">local TTS</text><rect x="865" y="150" width="145" height="75" rx="16" fill="#dce9ff"/><text x="938" y="194">WebRTC audio</text></g><g stroke="#64748b" stroke-width="4"><path d="M175 188h30M330 188h30M485 188h30M680 188h30M835 188h30"/></g><path d="M268 225v95h505v-95" stroke="#b55b78" stroke-width="4" fill="none"/><text x="520" y="350" font-size="18" font-weight="700" fill="#8c3f59">confirmed speech cancels queued audio, then steers the same run</text><text x="520" y="407" font-size="16" fill="#59677f">Every seam can be timed, tested and replaced independently.</text></g></svg>
