<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Four gates in the local model shootout</title><desc id="d">Models move through VRAM fit, speed, task quality and agent reliability gates before receiving a role.</desc><rect width="960" height="430" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="55" font-size="28" font-weight="700" fill="#17233d">Loading was only the first gate</text><g font-size="19" font-weight="700"><rect x="45" y="115" width="180" height="150" rx="18" fill="#dce9ff"/><text x="135" y="175" fill="#17233d">1 · VRAM fit</text><text x="135" y="210" font-size="15" font-weight="400">weights + cache</text><rect x="275" y="115" width="180" height="150" rx="18" fill="#d8f2e5"/><text x="365" y="175" fill="#17233d">2 · Speed</text><text x="365" y="210" font-size="15" font-weight="400">prefill + decode</text><rect x="505" y="115" width="180" height="150" rx="18" fill="#ffe8ba"/><text x="595" y="175" fill="#17233d">3 · Quality</text><text x="595" y="210" font-size="15" font-weight="400">stable benchmarks</text><rect x="735" y="115" width="180" height="150" rx="18" fill="#f3dcec"/><text x="825" y="175" fill="#17233d">4 · Reliability</text><text x="825" y="210" font-size="15" font-weight="400">contracts + tools</text></g><g stroke="#59677f" stroke-width="4"><path d="M225 190h50"/><path d="M455 190h50"/><path d="M685 190h50"/></g><text x="480" y="340" font-size="22" font-weight="700" fill="#17233d">Result: default worker · reviewer · long-context · fallback</text><text x="480" y="376" font-size="16" fill="#59677f">Different models earned different jobs.</text></g></svg>
