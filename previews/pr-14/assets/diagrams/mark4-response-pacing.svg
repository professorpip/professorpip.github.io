<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-labelledby="t d"><title id="t">Mark 4 response-priority pacing policy</title><desc id="d">A strict decision order from speech end: speak real answer text immediately when stable, otherwise a brief neutral audio cue after about 1.1 seconds, otherwise a spoken progress note only after a real observed milestone, with any pending cue cancelled the instant real speech or a real answer arrives.</desc><rect width="1040" height="440" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="520" y="52" font-size="26" font-weight="700" fill="#17233d">Speak only what is real, as soon as it is real</text><rect x="40" y="100" width="220" height="90" rx="16" fill="#d8f2e5"/><text x="150" y="135" font-size="16" font-weight="700" fill="#17233d">Stable answer text exists</text><text x="150" y="160" font-size="14" fill="#365646">speak it immediately</text><rect x="300" y="100" width="220" height="90" rx="16" fill="#ffe8ba"/><text x="410" y="135" font-size="16" font-weight="700" fill="#17233d">~1.1s, still nothing</text><text x="410" y="160" font-size="14" fill="#60420b">quiet neutral audio cue</text><rect x="560" y="100" width="220" height="90" rx="16" fill="#dce9ff"/><text x="670" y="128" font-size="16" font-weight="700" fill="#17233d">~3s more, real</text><text x="670" y="150" font-size="14" fill="#345995">milestone observed</text><text x="670" y="170" font-size="14" fill="#345995">spoken progress note</text><rect x="820" y="100" width="180" height="90" rx="16" fill="#f3dcec"/><text x="910" y="135" font-size="16" font-weight="700" fill="#7a2e57">Real speech</text><text x="910" y="158" font-size="14" fill="#7a2e57">or answer arrives</text><path d="M260 145h40M520 145h40M780 145h40" stroke="#64748b" stroke-width="4"/><path d="M910 190 C 910 250, 150 250, 150 190" stroke="#8c3f59" stroke-width="4" fill="none" stroke-dasharray="8 6"/><text x="520" y="300" font-size="17" font-weight="700" fill="#8c3f59">cancels any pending cue or note instantly</text><text x="520" y="360" font-size="15" fill="#59677f">Measured result: pre-tool commentary cut decision-to-audible feedback from about 2.6s to about 0.3s (p50) across ten live tool turns.</text><text x="520" y="390" font-size="15" fill="#59677f">Exact values are only ever spoken from a finished response, never from an in-progress streaming snapshot.</text></g></svg>
