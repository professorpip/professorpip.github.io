<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="t d"><title id="t">Mark 2 agent-switching voice gateway</title><desc id="d">One shared WebRTC speech transport routes recognised text through a wake-word router to one of two independently authoritative agent adapters, Tiggy or Midge, selected by spoken command.</desc><rect width="1040" height="480" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="520" y="52" font-size="27" font-weight="700" fill="#17233d">One transport, two agent adapters</text><rect x="60" y="95" width="200" height="90" rx="16" fill="#dce9ff"/><text x="160" y="130" font-size="17" font-weight="700" fill="#17233d">Safari WebRTC</text><text x="160" y="153" font-size="13" fill="#345995">capture + AEC + VAD</text><rect x="330" y="95" width="200" height="90" rx="16" fill="#ffe8ba"/><text x="430" y="130" font-size="17" font-weight="700" fill="#17233d">Local ASR</text><text x="430" y="153" font-size="13" fill="#60420b">MLX Nemotron</text><rect x="600" y="95" width="230" height="90" rx="16" fill="#17233d"/><text x="715" y="130" font-size="17" font-weight="700" fill="white">Operator router</text><text x="715" y="153" font-size="13" fill="#cbd5f5">wake word + connect intent</text><path d="M260 140h70M530 140h70" stroke="#64748b" stroke-width="4"/><path d="M715 185v40" stroke="#64748b" stroke-width="4"/><rect x="415" y="260" width="240" height="80" rx="16" fill="#d8f2e5"/><text x="535" y="292" font-size="17" font-weight="700" fill="#17233d">agent_adapters.py</text><text x="535" y="315" font-size="13" fill="#365646">common connect/send/interrupt contract</text><path d="M535 260v-35" stroke="#64748b" stroke-width="4"/><rect x="150" y="380" width="230" height="80" rx="16" fill="#f3dcec"/><text x="265" y="412" font-size="17" font-weight="700" fill="#7a2e57">Tiggy adapter</text><text x="265" y="435" font-size="13" fill="#7a2e57">OpenClaw Gateway session + steer</text><rect x="660" y="380" width="230" height="80" rx="16" fill="#f3dcec"/><text x="775" y="412" font-size="17" font-weight="700" fill="#7a2e57">Midge adapter</text><text x="775" y="435" font-size="13" fill="#7a2e57">SSH stdio to Hermes JSON-RPC</text><path d="M480 300 C 380 320, 300 350, 265 380" stroke="#345995" stroke-width="4" fill="none"/><path d="M590 300 C 690 320, 760 350, 775 380" stroke="#345995" stroke-width="4" fill="none"/><text x="520" y="470" font-size="15" fill="#59677f">"Operator, connect me to Midge" switches the live microphone/speaker session without restarting anything.</text></g></svg>
