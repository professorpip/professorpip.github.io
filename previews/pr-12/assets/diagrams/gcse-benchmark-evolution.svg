<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of the GCSE local-LLM benchmark</title>
  <desc id="desc">Five stages show the test growing from a friendly 84-mark pilot to a frozen 1,019-mark cross-subject benchmark.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#69746d"/></marker>
    <style>
      .bg{fill:#f5f2ea}.edge{fill:none;stroke:#69746d;stroke-width:4;marker-end:url(#arrow)}.node{stroke:#69746d;stroke-width:2}.pilot{fill:#f5c7b0}.test{fill:#d8e3d8}.freeze{fill:#f2b58f}.label{fill:#17211b;font:700 23px system-ui,sans-serif;text-anchor:middle}.big{fill:#17211b;font:800 35px system-ui,sans-serif;text-anchor:middle}.small{fill:#536059;font:19px system-ui,sans-serif;text-anchor:middle}.title{fill:#17211b;font:800 34px system-ui,sans-serif}.note{fill:#536059;font:21px system-ui,sans-serif;text-anchor:middle}
      @media(prefers-color-scheme:dark){.bg{fill:#19211c}.pilot{fill:#74432e}.test{fill:#344a3a}.freeze{fill:#914625}.label,.big,.title{fill:#eef2eb}.small,.note{fill:#b7c1ba}.node,.edge{stroke:#9eaaa2}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text class="title" x="62" y="67">From flattering demo to reusable evidence</text>
  <path class="edge" d="M252 260H286"/><path class="edge" d="M468 260H502"/><path class="edge" d="M684 260H718"/><path class="edge" d="M900 260H934"/>
  <rect class="node pilot" x="48" y="154" width="204" height="212" rx="20"/>
  <text class="label" x="150" y="198">Friendly pilot</text><text class="big" x="150" y="253">84</text><text class="small" x="150" y="286">marks</text><text class="small" x="150" y="327">Text-friendly subset</text><text class="small" x="150" y="351">82/84: too flattering</text>
  <rect class="node test" x="286" y="154" width="182" height="212" rx="20"/>
  <text class="label" x="377" y="198">Version 1</text><text class="big" x="377" y="253">361</text><text class="small" x="377" y="286">eligible marks</text><text class="small" x="377" y="327">Text only</text><text class="small" x="377" y="351">72.5% coverage</text>
  <rect class="node test" x="502" y="154" width="182" height="212" rx="20"/>
  <text class="label" x="593" y="198">Version 2</text><text class="big" x="593" y="253">498</text><text class="small" x="593" y="286">marks</text><text class="small" x="593" y="327">Vision routing</text><text class="small" x="593" y="351">100% coverage</text>
  <rect class="node test" x="718" y="154" width="182" height="212" rx="20"/>
  <text class="label" x="809" y="198">Version 3</text><text class="big" x="809" y="253">437</text><text class="small" x="809" y="286">of 498</text><text class="small" x="809" y="327">Permitted aids</text><text class="small" x="809" y="351">Only +1 mark</text>
  <rect class="node freeze" x="934" y="134" width="218" height="252" rx="20"/>
  <text class="label" x="1043" y="184">Frozen baseline</text><text class="big" x="1043" y="244">1,019</text><text class="small" x="1043" y="278">marks</text><text class="small" x="1043" y="321">14 components</text><text class="small" x="1043" y="348">893/1,019</text>
  <text class="note" x="600" y="474">Better input routing expanded what could be tested.</text>
  <text class="note" x="600" y="512">Freezing prompts, answers and exclusions made the result reusable.</text>
</svg>
