<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="t d"><title id="t">Emergency model orphan lifecycle</title><desc id="d">A Gateway launches a fallback model, a watchdog replaces the Gateway, and a conservative reaper removes the detached model.</desc><rect width="960" height="490" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="52" font-size="28" font-weight="700" fill="#17233d">Service recovered; the child process did not</text><rect x="55" y="135" width="190" height="95" rx="18" fill="#dce9ff"/><text x="150" y="175" font-size="20" font-weight="700" fill="#17233d">Gateway A</text><text x="150" y="205" font-size="15" fill="#59677f">starts fallback</text><rect x="310" y="135" width="190" height="95" rx="18" fill="#ffe8ba"/><text x="405" y="175" font-size="20" font-weight="700" fill="#17233d">Mac Qwen</text><text x="405" y="205" font-size="15" fill="#59677f">600 s idle timer</text><path d="M245 182h65" stroke="#64748b" stroke-width="4" fill="none"/><path d="M150 250v50h255" stroke="#b55b78" stroke-width="4" stroke-dasharray="10 8" fill="none"/><text x="275" y="328" font-size="15" fill="#8c3f59">Gateway killed → parent link lost</text><rect x="565" y="135" width="160" height="95" rx="18" fill="#d8f2e5"/><text x="645" y="175" font-size="20" font-weight="700" fill="#17233d">Gateway B</text><text x="645" y="205" font-size="15" fill="#59677f">healthy replacement</text><rect x="780" y="135" width="140" height="95" rx="18" fill="#f3dcec"/><text x="850" y="175" font-size="20" font-weight="700" fill="#17233d">Reaper</text><text x="850" y="205" font-size="15" fill="#59677f">revalidates</text><path d="M725 182h55" stroke="#64748b" stroke-width="4" fill="none"/><path d="M850 230v110H405v-110" stroke="#64748b" stroke-width="4" fill="none"/><text x="628" y="373" font-size="17" font-weight="700" fill="#17233d">exact match · no client · seen twice · TERM first</text><text x="480" y="438" font-size="16" fill="#59677f">Lifecycle is a separate acceptance gate from request success.</text></g></svg>
