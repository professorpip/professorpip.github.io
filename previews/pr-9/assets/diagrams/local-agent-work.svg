<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Constant-model harness comparison</title><desc id="d">Hermes, DeepSeek Harness and Pi use the same local model, then submit artefacts to an external verifier.</desc><rect width="960" height="470" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="52" font-size="28" font-weight="700" fill="#17233d">Same model, different executive function</text><rect x="330" y="82" width="300" height="68" rx="18" fill="#17233d"/><text x="480" y="124" font-size="21" font-weight="700" fill="white">One 32K local model</text><g stroke="#64748b" stroke-width="4" fill="none"><path d="M480 150v45H170v38"/><path d="M480 150v83"/><path d="M480 195h310v38"/></g><g font-size="19" font-weight="700" fill="#17233d"><rect x="70" y="233" width="200" height="70" rx="16" fill="#dce9ff"/><text x="170" y="276">Hermes</text><rect x="380" y="233" width="200" height="70" rx="16" fill="#d8f2e5"/><text x="480" y="276">DeepSeek</text><rect x="690" y="233" width="200" height="70" rx="16" fill="#ffe8ba"/><text x="790" y="276">Pi</text></g><g stroke="#64748b" stroke-width="4" fill="none"><path d="M170 303v45h310"/><path d="M480 303v45"/><path d="M790 303v45H480"/></g><rect x="310" y="348" width="340" height="70" rx="18" fill="#b55b78"/><text x="480" y="391" font-size="20" font-weight="700" fill="white">External verifier decides “done”</text></g></svg>
