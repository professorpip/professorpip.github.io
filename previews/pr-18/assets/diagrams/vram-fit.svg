<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Sixteen gigabyte VRAM budget</title><desc id="d">A stacked bar allocates VRAM to model weights, KV cache, runtime overhead and operating headroom.</desc><rect width="960" height="430" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif"><text x="480" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#17233d">The checkpoint does not own all 16 GB</text><rect x="70" y="135" width="820" height="110" rx="18" fill="#e5e7eb"/><path d="M88 135h500v110H88a18 18 0 0 1-18-18v-74a18 18 0 0 1 18-18" fill="#345995"/><rect x="588" y="135" width="135" height="110" fill="#55a67a"/><rect x="723" y="135" width="72" height="110" fill="#e8a13a"/><path d="M795 135h77a18 18 0 0 1 18 18v74a18 18 0 0 1-18 18h-77" fill="#b55b78"/><g font-size="16" font-weight="700" text-anchor="middle"><text x="338" y="195" fill="white">Model weights</text><text x="655" y="195" fill="#102c21">KV cache</text><text x="759" y="185" fill="#4b2a00">Runtime</text><text x="759" y="207" fill="#4b2a00">overhead</text><text x="842" y="185" fill="white">Safety</text><text x="842" y="207" fill="white">margin</text></g><text x="480" y="325" text-anchor="middle" font-size="21" font-weight="700" fill="#17233d">Context, drafting and expert caches all move the boundaries.</text><text x="480" y="360" text-anchor="middle" font-size="16" fill="#59677f">A technically loadable model can still be an operationally bad fit.</text></g></svg>
