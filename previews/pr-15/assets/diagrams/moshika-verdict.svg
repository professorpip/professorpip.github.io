<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">Moshika integration verdict</title><desc id="d">Excellent latency and true duplex are outweighed by weak deterministic barge-in and an unsuitable text seam.</desc><rect width="960" height="450" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="54" font-size="28" font-weight="700" fill="#17233d">A fast conversation is not yet a controllable agent</text><path d="M480 120v180" stroke="#17233d" stroke-width="7"/><path d="M250 300h460" stroke="#17233d" stroke-width="8"/><path d="M285 300l-70-125h140z" fill="#d8f2e5"/><path d="M675 300l-70-125h140z" fill="#f3dcec"/><text x="285" y="345" font-size="20" font-weight="700" fill="#17233d">Impressive</text><text x="285" y="377" font-size="15" fill="#59677f">135 ms · true duplex</text><text x="675" y="345" font-size="20" font-weight="700" fill="#17233d">Wrong seam</text><text x="675" y="377" font-size="15" fill="#59677f">partial barge-in · inner monologue</text><circle cx="480" cy="120" r="18" fill="#345995"/><text x="480" y="420" font-size="16" fill="#59677f">Control and identity outweighed demo latency.</text></g></svg>
