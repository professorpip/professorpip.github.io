<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d"><title id="t">Tiggy's three model tiers</title><desc id="d">A router sends tasks to cloud intelligence, a wake-on-demand Ryzen GPU or a small Mac emergency fallback.</desc><rect width="960" height="500" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="52" font-size="28" font-weight="700" fill="#17233d">Route by health, capability and risk</text><rect x="360" y="85" width="240" height="70" rx="18" fill="#17233d"/><text x="480" y="128" font-size="21" font-weight="700" fill="white">Tiggy / task router</text><g stroke="#64748b" stroke-width="4" fill="none"><path d="M480 155v55H170v45"/><path d="M480 155v100"/><path d="M480 210h310v45"/></g><rect x="55" y="255" width="230" height="145" rx="20" fill="#dce9ff"/><rect x="365" y="255" width="230" height="145" rx="20" fill="#d8f2e5"/><rect x="675" y="255" width="230" height="145" rx="20" fill="#ffe8ba"/><g fill="#17233d"><text x="170" y="303" font-size="22" font-weight="700">Cloud</text><text x="170" y="340" font-size="16">main reasoning tier</text><text x="170" y="370" font-size="15">highest capability</text><text x="480" y="303" font-size="22" font-weight="700">Ryzen GPU</text><text x="480" y="340" font-size="16">wake-on-demand worker</text><text x="480" y="370" font-size="15">private, measured roles</text><text x="790" y="303" font-size="22" font-weight="700">Mac local</text><text x="790" y="340" font-size="16">emergency fallback</text><text x="790" y="370" font-size="15">slow, narrow, available</text></g><text x="480" y="455" font-size="17" fill="#59677f">Lower tiers receive smaller contexts, fewer tools and less authority.</text></g></svg>
