<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">One-tap lab notebook publishing workflow</title>
  <desc id="desc">Tiggy prepares evidence and Markdown in a private source repository. A pull request runs validation and publishes an unlisted noindex preview for Phil to review on his phone. Revisions loop back through the preview. An approved merge builds the public site in a separate generated-output repository, while closing the pull request removes its preview.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#69746d"/></marker>
    <style>
      .bg{fill:#f5f2ea}.zone{fill:none;stroke:#69746d;stroke-width:2;stroke-dasharray:10 8}.edge{fill:none;stroke:#69746d;stroke-width:4;marker-end:url(#arrow)}.loop{fill:none;stroke:#a85632;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow)}.node{stroke:#69746d;stroke-width:2}.private{fill:#d8e3d8}.review{fill:#f5c7b0}.public{fill:#f2b58f}.label{fill:#17211b;font:700 23px system-ui,sans-serif;text-anchor:middle}.compact{fill:#17211b;font:700 20px system-ui,sans-serif;text-anchor:middle}.small{fill:#536059;font:18px system-ui,sans-serif;text-anchor:middle}.title{fill:#17211b;font:800 34px system-ui,sans-serif}.zone-label{fill:#536059;font:700 19px system-ui,sans-serif;letter-spacing:1px}.boundary{fill:#8a3d1d;font:700 18px system-ui,sans-serif;text-anchor:middle}.tap{fill:#8a3d1d;font:800 19px system-ui,sans-serif;text-anchor:middle}
      @media(prefers-color-scheme:dark){.bg{fill:#19211c}.private{fill:#344a3a}.review{fill:#74432e}.public{fill:#914625}.label,.compact,.title{fill:#eef2eb}.small,.zone-label{fill:#b7c1ba}.boundary,.tap{fill:#ff9b6d}.node,.edge,.zone{stroke:#9eaaa2}.loop{stroke:#ff9b6d}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="820" rx="24"/>
  <text class="title" x="52" y="58">Private workshop → reviewed proposal → public notebook</text>

  <rect class="zone" x="35" y="88" width="720" height="650" rx="22"/>
  <text class="zone-label" x="60" y="122">PRIVATE SOURCE REPOSITORY</text>
  <rect class="zone" x="790" y="88" width="375" height="650" rx="22"/>
  <text class="zone-label" x="815" y="122">PUBLIC GENERATED OUTPUT</text>
  <text class="boundary" x="772" y="420" transform="rotate(-90 772 420)">publication boundary</text>

  <rect class="node private" x="70" y="165" width="250" height="155" rx="20"/>
  <text class="compact" x="195" y="207">Evidence + Markdown</text>
  <text class="small" x="195" y="245">project artefacts</text>
  <text class="small" x="195" y="273">privacy pass · resources</text>
  <text class="small" x="195" y="301">article branch</text>

  <path class="edge" d="M320 242H370"/>
  <rect class="node private" x="370" y="145" width="335" height="195" rx="20"/>
  <text class="label" x="537" y="187">Pull request workflow</text>
  <text class="small" x="537" y="225">clean Eleventy build</text>
  <text class="small" x="537" y="253">Pagefind + internal links</text>
  <text class="small" x="537" y="281">prefixed preview build</text>
  <text class="small" x="537" y="309">comment preview URL</text>

  <path class="edge" d="M705 242H845"/>
  <rect class="node public" x="845" y="155" width="270" height="175" rx="20"/>
  <text class="label" x="980" y="198">Rendered preview</text>
  <text class="small" x="980" y="236">/previews/pr-N/</text>
  <text class="small" x="980" y="266">unlisted · noindex</text>
  <text class="small" x="980" y="296">generated files only</text>

  <path class="edge" d="M980 330V392H650"/>
  <rect class="node review" x="410" y="372" width="240" height="145" rx="20"/>
  <text class="label" x="530" y="415">Phone review</text>
  <text class="small" x="530" y="453">Phil checks the page</text>
  <text class="small" x="530" y="483">request edits or approve</text>

  <path class="loop" d="M410 444H195V320"/>
  <text class="tap" x="299" y="426">revise</text>

  <path class="edge" d="M530 517V570"/>
  <rect class="node review" x="410" y="570" width="240" height="110" rx="20"/>
  <text class="compact" x="530" y="612">Merge approved PR</text>
  <text class="tap" x="530" y="648">the one tap</text>

  <path class="edge" d="M650 625H845"/>
  <rect class="node public" x="845" y="545" width="270" height="160" rx="20"/>
  <text class="label" x="980" y="587">Production Pages</text>
  <text class="small" x="980" y="625">build main again</text>
  <text class="small" x="980" y="653">publish generated site</text>
  <text class="small" x="980" y="681">verify live URL + assets</text>

  <path class="loop" d="M650 590H770V360H845V330"/>
  <text class="small" x="965" y="407">PR close removes preview</text>
</svg>
