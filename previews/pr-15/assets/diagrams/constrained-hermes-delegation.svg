<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Constrained Hermes delegation</title><desc id="d">A principal delegates through a supervising coordinator, a task permission envelope and a narrow worker adapter.</desc><rect width="960" height="460" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="52" font-size="28" font-weight="700" fill="#17233d">Delegate the job, not the identity</text><rect x="55" y="150" width="170" height="90" rx="18" fill="#dce9ff"/><text x="140" y="188" font-size="20" font-weight="700" fill="#17233d">Principal</text><text x="140" y="217" font-size="15" fill="#59677f">sets intent</text><rect x="285" y="150" width="170" height="90" rx="18" fill="#d8f2e5"/><text x="370" y="188" font-size="20" font-weight="700" fill="#17233d">Supervisor</text><text x="370" y="217" font-size="15" fill="#59677f">bounds task</text><rect x="515" y="115" width="190" height="160" rx="18" fill="#ffe8ba"/><text x="610" y="157" font-size="19" font-weight="700" fill="#17233d">Task envelope</text><text x="610" y="193" font-size="15" fill="#4b3a16">objective</text><text x="610" y="219" font-size="15" fill="#4b3a16">direction</text><text x="610" y="245" font-size="15" fill="#4b3a16">permissions</text><rect x="765" y="150" width="150" height="90" rx="18" fill="#f3dcec"/><text x="840" y="188" font-size="20" font-weight="700" fill="#17233d">Hermes</text><text x="840" y="217" font-size="15" fill="#59677f">narrow adapter</text><g stroke="#64748b" stroke-width="4"><path d="M225 195h60"/><path d="M455 195h60"/><path d="M705 195h60"/></g><text x="480" y="350" font-size="20" font-weight="700" fill="#17233d">Worker reports flow back up; authority does not flow sideways.</text><text x="480" y="386" font-size="16" fill="#59677f">Unexpected requests stop for supervisory judgement.</text></g></svg>
