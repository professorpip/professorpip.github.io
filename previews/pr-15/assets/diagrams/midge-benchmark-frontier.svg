<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Midge real-work benchmark results by model</title><desc id="d">Five candidate models scored against 18 frozen routine and senior tasks, split into overall points and passes.</desc><rect width="960" height="520" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="50" font-size="26" font-weight="700" fill="#17233d">18 frozen tasks, five candidates</text><text x="480" y="78" font-size="16" fill="#475569">9 routine Midge tasks + 9 senior Tiggy tasks, scored 0-10 each</text>
<g font-size="15" font-weight="700" fill="white">
