<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Evidence-led LAN inventory</title><desc id="d">ICMP, ARP and local names feed an inventory which retains confidence and unknown states.</desc><rect width="960" height="470" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="54" font-size="28" font-weight="700" fill="#17233d">Useful evidence, honest uncertainty</text><g font-size="19" font-weight="700" fill="#17233d"><rect x="55" y="115" width="180" height="75" rx="16" fill="#dce9ff"/><text x="145" y="160">ICMP reply</text><rect x="55" y="215" width="180" height="75" rx="16" fill="#d8f2e5"/><text x="145" y="260">ARP entry</text><rect x="55" y="315" width="180" height="75" rx="16" fill="#ffe8ba"/><text x="145" y="360">local name</text><rect x="360" y="145" width="250" height="210" rx="24" fill="#17233d"/><text x="485" y="198" fill="white">Living inventory</text><text x="485" y="242" font-size="15" fill="white">observed address</text><text x="485" y="273" font-size="15" fill="white">interface + time</text><text x="485" y="304" font-size="15" fill="white">evidence type</text><text x="485" y="335" font-size="15" fill="white">confidence</text></g><g stroke="#64748b" stroke-width="4"><path d="M235 152h125M235 252h125M235 352h125"/></g><rect x="730" y="175" width="175" height="150" rx="20" fill="#f3dcec"/><text x="818" y="218" font-size="19" font-weight="700" fill="#17233d">Still unknown</text><text x="818" y="254" font-size="15" fill="#59677f">sleeping devices</text><text x="818" y="280" font-size="15" fill="#59677f">private MACs</text><text x="818" y="306" font-size="15" fill="#59677f">other subnets</text><path d="M610 250h120" stroke="#64748b" stroke-width="4"/><text x="480" y="426" font-size="16" fill="#59677f">Deeper scanning remains a task-specific choice, not the default.</text></g></svg>
