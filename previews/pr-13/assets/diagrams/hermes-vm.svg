<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Hermes VM boundaries</title><desc id="d">A constrained virtual machine connects an allowlisted chat ingress and local model to bounded job adapters.</desc><rect width="960" height="470" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="52" font-size="28" font-weight="700" fill="#17233d">Capability inside boundaries</text><rect x="300" y="92" width="360" height="275" rx="28" fill="#dce9ff" stroke="#345995" stroke-width="4"/><text x="480" y="132" font-size="18" font-weight="700" fill="#345995">Ubuntu VM · unprivileged user</text><rect x="365" y="162" width="230" height="68" rx="16" fill="#17233d"/><text x="480" y="204" font-size="23" font-weight="700" fill="white">Hermes gateway</text><rect x="345" y="265" width="270" height="62" rx="15" fill="#fff"/><text x="480" y="302" font-size="18" fill="#17233d">bounded job adapters</text><rect x="40" y="170" width="195" height="100" rx="18" fill="#d8f2e5"/><text x="138" y="208" font-size="19" font-weight="700" fill="#17233d">Telegram</text><text x="138" y="240" font-size="15" fill="#365646">allowlist + mention gate</text><rect x="725" y="170" width="195" height="100" rx="18" fill="#ffe8ba"/><text x="823" y="208" font-size="19" font-weight="700" fill="#17233d">Local model</text><text x="823" y="240" font-size="15" fill="#60420b">OpenAI-compatible API</text><path d="M235 220h65M660 220h65" stroke="#64748b" stroke-width="4"/><text x="480" y="420" font-size="17" fill="#59677f">No destructive action, external writes or household control by default.</text></g></svg>
