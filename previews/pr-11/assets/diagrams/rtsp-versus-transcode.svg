<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Direct RTSP versus continuous transcode</title><desc id="d">A compressed camera stream can be routed directly or decoded, rotated and encoded again on the server.</desc><rect width="1000" height="470" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="500" y="54" font-size="28" font-weight="700" fill="#17233d">One URL changed the compute graph</text><rect x="45" y="170" width="180" height="95" rx="18" fill="#dce9ff"/><text x="135" y="210" font-size="20" font-weight="700" fill="#17233d">Camera RTSP</text><text x="135" y="239" font-size="15" fill="#59677f">already H.264</text><path d="M225 217h95v-90h90" stroke="#55a67a" stroke-width="5" fill="none"/><rect x="410" y="85" width="230" height="85" rx="18" fill="#d8f2e5"/><text x="525" y="120" font-size="20" font-weight="700" fill="#17233d">Direct restream</text><text x="525" y="147" font-size="15" fill="#59677f">route packets</text><path d="M225 217h95v120h90" stroke="#b55b78" stroke-width="5" fill="none"/><rect x="410" y="290" width="350" height="95" rx="18" fill="#f3dcec"/><text x="585" y="328" font-size="20" font-weight="700" fill="#17233d">decode → rotate → libx264</text><text x="585" y="358" font-size="15" fill="#59677f">continuous CPU work × six streams</text><rect x="800" y="170" width="155" height="95" rx="18" fill="#ffe8ba"/><text x="878" y="210" font-size="20" font-weight="700" fill="#17233d">Frigate</text><text x="878" y="239" font-size="15" fill="#59677f">detect + record</text><path d="M640 127h238v43M760 338h118v-73" stroke="#64748b" stroke-width="4" fill="none"/><text x="500" y="433" font-size="16" fill="#59677f">Put compatibility transforms off the always-on path.</text></g></svg>
