<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">Local Sunsynk telemetry path</title><desc id="d">An inverter uses RS-485 to a Raspberry Pi mbusd gateway, then Modbus TCP to Home Assistant and local entities.</desc><rect width="1000" height="450" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="500" y="54" font-size="28" font-weight="700" fill="#17233d">Prove each protocol boundary</text><g font-size="19" font-weight="700" fill="#17233d"><rect x="35" y="145" width="170" height="105" rx="18" fill="#ffe8ba"/><text x="120" y="190">Inverter</text><text x="120" y="219" font-size="14">Modbus RTU</text><rect x="295" y="125" width="210" height="145" rx="20" fill="#d8f2e5"/><text x="400" y="174">Raspberry Pi</text><rect x="335" y="198" width="130" height="42" rx="12" fill="white"/><text x="400" y="226" font-size="15">mbusd</text><rect x="595" y="145" width="170" height="105" rx="18" fill="#dce9ff"/><text x="680" y="190">HA add-on</text><text x="680" y="219" font-size="14">72 sensors</text><rect x="855" y="145" width="110" height="105" rx="18" fill="#f3dcec"/><text x="910" y="190">MQTT</text><text x="910" y="219" font-size="14">local</text></g><path d="M205 198h90M505 198h90M765 198h90" stroke="#64748b" stroke-width="4"/><text x="250" y="181" font-size="13" fill="#59677f">RS-485</text><text x="550" y="181" font-size="13" fill="#59677f">Modbus TCP</text><text x="810" y="181" font-size="13" fill="#59677f">entities</text><text x="500" y="340" font-size="20" font-weight="700" fill="#17233d">CRC-good RTU → matching TCP response → application logs</text><text x="500" y="382" font-size="16" fill="#59677f">Cloud telemetry remains separate for read-across.</text></g></svg>
