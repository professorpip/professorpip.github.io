<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">TVHeadend layered debugging</title><desc id="d">Two tuners feed TVHeadend on a dual-homed Raspberry Pi, then a wired discovery path reaches Plex; the USB tuner and stale client state are marked as faults.</desc><rect width="1000" height="480" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="500" y="52" font-size="28" font-weight="700" fill="#17233d">Test one boundary at a time</text><rect x="35" y="115" width="170" height="80" rx="16" fill="#d8f2e5"/><text x="120" y="149" font-size="19" font-weight="700" fill="#17233d">Sony HAT</text><text x="120" y="176" font-size="14" fill="#59677f">clean stream</text><rect x="35" y="260" width="170" height="80" rx="16" fill="#f3dcec"/><text x="120" y="294" font-size="19" font-weight="700" fill="#17233d">USB tuner</text><text x="120" y="321" font-size="14" fill="#8c3f59">UNC + continuity</text><rect x="315" y="145" width="230" height="165" rx="22" fill="#dce9ff"/><text x="430" y="191" font-size="21" font-weight="700" fill="#17233d">TVHeadend</text><text x="430" y="229" font-size="15" fill="#59677f">local stream passes</text><text x="430" y="259" font-size="15" fill="#59677f">wired + Wi-Fi</text><rect x="655" y="145" width="150" height="165" rx="22" fill="#ffe8ba"/><text x="730" y="191" font-size="19" font-weight="700" fill="#17233d">HDHomeRun</text><text x="730" y="229" font-size="15" fill="#59677f">wired address</text><text x="730" y="259" font-size="15" fill="#59677f">one tuner</text><rect x="865" y="175" width="105" height="105" rx="18" fill="#d8f2e5"/><text x="918" y="221" font-size="19" font-weight="700" fill="#17233d">Plex</text><text x="918" y="250" font-size="14" fill="#59677f">reset state</text><path d="M205 155h110M205 300h110M545 228h110M805 228h60" stroke="#64748b" stroke-width="4"/><text x="500" y="390" font-size="20" font-weight="700" fill="#17233d">Source → server → discovery → client</text><text x="500" y="428" font-size="16" fill="#59677f">A working local stream narrowed the repair instead of hiding two faults.</text></g></svg>
