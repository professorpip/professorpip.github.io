<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">Health check disturbs a serial bridge</title><desc id="d">A monitoring connection briefly interrupts Home Assistant's single-client serial path before ZHA reconnects.</desc><rect width="960" height="450" rx="28" fill="#f7f3ea"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="54" font-size="28" font-weight="700" fill="#17233d">The observer joined the system</text><rect x="60" y="145" width="210" height="100" rx="18" fill="#dce9ff"/><text x="165" y="185" font-size="20" font-weight="700" fill="#17233d">Home Assistant</text><text x="165" y="216" font-size="15" fill="#59677f">live serial client</text><rect x="375" y="145" width="210" height="100" rx="18" fill="#ffe8ba"/><text x="480" y="185" font-size="20" font-weight="700" fill="#17233d">ser2net socket</text><text x="480" y="216" font-size="15" fill="#59677f">one coordinator</text><rect x="690" y="145" width="210" height="100" rx="18" fill="#f3dcec"/><text x="795" y="185" font-size="20" font-weight="700" fill="#17233d">Port probe</text><text x="795" y="216" font-size="15" fill="#59677f">not passive</text><path d="M270 195h105" stroke="#345995" stroke-width="5"/><path d="M690 195H585" stroke="#b55b78" stroke-width="5"/><text x="480" y="310" font-size="21" font-weight="700" fill="#8c3f59">ZHA unavailable for ~8 seconds</text><path d="M375 350H270" stroke="#55a67a" stroke-width="5"/><text x="480" y="388" font-size="16" fill="#59677f">Recovery follows when Home Assistant reconnects.</text></g></svg>
